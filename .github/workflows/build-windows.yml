name: Build Windows App

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*'  # Trigger on version tags

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: List files (debug)
        run: |
          Get-Location
          Get-ChildItem -Force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib
          # Core dependencies
          pip install opencv-python numpy pandas pywebview openpyxl Pillow jsonschema rich matplotlib dotmap deepmerge screeninfo
          # ML/AI dependencies for name detection (CPU-only PyTorch for faster build)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install easyocr

      - name: Build Windows executable
        run: |
          Get-ChildItem -Filter "*.spec"
          python -m PyInstaller build.spec --clean --noconfirm

      - name: List dist folder
        run: |
          Get-ChildItem -Path dist -Recurse

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: VB-OMR-Scanner-Windows
          path: dist/*.exe
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.exe
          body: |
            ## VB OMR Scanner ${{ github.ref_name }}

            ### Features
            - AI-powered name detection using bubble grid recognition
            - EasyOCR fallback for handwritten names
            - Batch OMR sheet processing
            - Excel export with scoring and rankings

            ### Installation
            1. Download `VB OMR Scanner.exe`
            2. Run the executable (no installation required)
            3. Or use the MSI installer for system-wide installation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
