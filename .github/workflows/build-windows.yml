name: Build Windows App

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*'  # Trigger on version tags

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: List files (debug)
        run: |
          Get-Location
          Get-ChildItem -Force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib
          # Core dependencies
          pip install opencv-python numpy pandas pywebview openpyxl Pillow jsonschema rich matplotlib dotmap deepmerge screeninfo
          # ML/AI dependencies for name detection (CPU-only PyTorch for faster build)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install easyocr

      - name: Build Windows executable
        run: |
          Get-ChildItem -Filter "*.spec"
          python -m PyInstaller build.spec --clean --noconfirm

      - name: List dist folder
        run: |
          Get-ChildItem -Path dist -Recurse

      - name: Install WiX Toolset
        run: |
          # Install WiX v3 using dotnet tool
          dotnet tool install --global wix --version 4.0.5
          # Add to PATH
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create license.rtf
        run: |
          @"
          {\rtf1\ansi\deff0
          {\fonttbl{\f0 Arial;}}
          \f0\fs20
          VB OMR Scanner - Vidya Bharti Pratibha Khoj\par
          \par
          Copyright (c) 2025 Vidya Bharti. All rights reserved.\par
          \par
          This software is proprietary and confidential.\par
          }
          "@ | Out-File -FilePath license.rtf -Encoding ascii

      - name: Build MSI installer
        run: |
          # Use WiX v4 to build MSI
          wix build -o "dist\VB_OMR_Scanner.msi" "installer.wxs" -ext WixToolset.UI.wixext
        continue-on-error: true

      - name: Build MSI with WiX v3 (fallback)
        if: failure()
        run: |
          # Install WiX v3 via chocolatey as fallback
          choco install wixtoolset -y --no-progress
          $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.14\bin;$env:PATH"

          # Compile and link
          candle.exe -nologo -out "dist\installer.wixobj" "installer.wxs" -ext WixUIExtension
          light.exe -nologo -out "dist\VB_OMR_Scanner.msi" "dist\installer.wixobj" -ext WixUIExtension -spdb

          # Cleanup
          Remove-Item "dist\installer.wixobj" -ErrorAction SilentlyContinue

      - name: List final dist folder
        run: |
          Get-ChildItem -Path dist

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VB-OMR-Scanner-Windows-EXE
          path: dist/*.exe
          retention-days: 30

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: VB-OMR-Scanner-Windows-MSI
          path: dist/*.msi
          retention-days: 30
          if-no-files-found: ignore

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/*.msi
          body: |
            ## VB OMR Scanner ${{ github.ref_name }}

            ### Features
            - AI-powered name detection using bubble grid recognition
            - EasyOCR fallback for handwritten names
            - Batch OMR sheet processing
            - Excel export with scoring and rankings
            - **0% blank name detection** with OCR verification

            ### Installation Options
            1. **Portable**: Download `VB OMR Scanner.exe` - no installation required
            2. **MSI Installer**: Download `VB_OMR_Scanner.msi` for system-wide installation with Start Menu shortcuts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
