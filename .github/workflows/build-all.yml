name: Build All Platforms

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions tab
    inputs:
      version:
        description: 'Version number (e.g., 1.0.1)'
        required: false
        default: '1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib pytest
          # Core dependencies
          pip install opencv-python numpy pandas pywebview openpyxl Pillow jsonschema rich matplotlib dotmap deepmerge screeninfo
          # ML/AI dependencies for name detection (CPU-only PyTorch for faster build)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install easyocr

      - name: Run unit tests
        run: |
          python -m pytest tests/test_omr_engine.py -v --tb=short
        continue-on-error: true

      - name: Run regression tests (if golden dataset exists)
        run: |
          if (Test-Path "golden_dataset/ground_truth.json") {
            python -m pytest tests/test_regression.py -v --tb=short
          } else {
            Write-Host "Skipping regression tests - no golden dataset"
          }
        shell: pwsh
        continue-on-error: true

      - name: Build Windows executable
        run: |
          python -m PyInstaller build.spec --clean --noconfirm

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: VB-OMR-Scanner-Windows-${{ github.event.inputs.version }}
          path: dist/*.exe
          retention-days: 90

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib pytest
          # Core dependencies
          pip install opencv-python numpy pandas pywebview openpyxl Pillow jsonschema rich matplotlib dotmap deepmerge screeninfo
          # macOS-specific
          pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-WebKit
          # ML/AI dependencies for name detection
          pip install torch torchvision
          pip install easyocr

      - name: Run unit tests
        run: |
          python -m pytest tests/test_omr_engine.py -v --tb=short
        continue-on-error: true

      - name: Run regression tests (if golden dataset exists)
        run: |
          if [ -f "golden_dataset/ground_truth.json" ]; then
            python -m pytest tests/test_regression.py -v --tb=short
          else
            echo "Skipping regression tests - no golden dataset"
          fi
        continue-on-error: true

      - name: Build macOS app
        run: |
          python -m PyInstaller build.spec --clean --noconfirm

      - name: Create DMG
        run: |
          hdiutil create -volname "VB OMR Scanner" -srcfolder "dist/VB OMR Scanner.app" -ov -format UDZO "dist/VB_OMR_Scanner_${{ github.event.inputs.version }}.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: VB-OMR-Scanner-macOS-${{ github.event.inputs.version }}
          path: |
            dist/VB OMR Scanner.app
            dist/*.dmg
          retention-days: 90

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event.inputs.version != '1.0.0'
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: VB-OMR-Scanner-Windows-${{ github.event.inputs.version }}
          path: windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: VB-OMR-Scanner-macOS-${{ github.event.inputs.version }}
          path: macos

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: VB OMR Scanner v${{ github.event.inputs.version }}
          body: |
            ## VB OMR Scanner v${{ github.event.inputs.version }}

            ### Features
            - AI-powered name detection using bubble grid recognition
            - EasyOCR fallback for handwritten names
            - Cross-platform support (Windows & macOS)
            - Excel export with scoring

            ### Downloads
            - **Windows:** `VB OMR Scanner.exe`
            - **macOS:** `VB_OMR_Scanner_${{ github.event.inputs.version }}.dmg`
          files: |
            windows/*.exe
            macos/*.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
