name: Build All Platforms

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions tab
    inputs:
      version:
        description: 'Version number (e.g., 1.0.1)'
        required: false
        default: '1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install opencv-python numpy pandas pywebview openpyxl Pillow jsonschema rich matplotlib dotmap deepmerge screeninfo

      - name: Build Windows executable
        run: |
          python -m PyInstaller build.spec --clean --noconfirm

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: VB-OMR-Scanner-Windows-${{ github.event.inputs.version }}
          path: dist/*.exe
          retention-days: 90

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install opencv-python numpy pandas pywebview openpyxl Pillow jsonschema rich matplotlib dotmap deepmerge screeninfo pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-WebKit

      - name: Build macOS app
        run: |
          python -m PyInstaller build.spec --clean --noconfirm

      - name: Create DMG
        run: |
          hdiutil create -volname "VB OMR Scanner" -srcfolder "dist/VB OMR Scanner.app" -ov -format UDZO "dist/VB_OMR_Scanner_${{ github.event.inputs.version }}.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: VB-OMR-Scanner-macOS-${{ github.event.inputs.version }}
          path: |
            dist/VB OMR Scanner.app
            dist/*.dmg
          retention-days: 90
